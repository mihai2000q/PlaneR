name: planer
services:
  database:
    image: postgres:17-alpine
    container_name: planer-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-planer}
      POSTGRES_USER: ${DB_USER:-planer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-planer}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - planer-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  server:
    build:
      context: .
      dockerfile: planer-server/Dockerfile
    container_name: planer-server
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      # Inside the compose network the database is reachable by its service name, not localhost.
      DB_HOST: database
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  planer-db-data:
